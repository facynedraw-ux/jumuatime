/* ── Cards commandes ── */
.order-card {
  background: white;
  border: 1px solid #E2D4BC;
  border-radius: 14px;

  gap: 13px;

}

.order-thumb {

  border-radius: 8px;
  background: #F5EDE0;
  flex-shrink: 0;
  overflow: hidden;
  object-fit: cover;
}
.order-thumb-placeholder {
  width: 52px; height: 64px;
  border-radius: 8px;
  background: #F5EDE0;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.order-meta { flex: 1; min-width: 0; }
.order-title {
  font-weight: 600; font-size: 13px;
  color: #1A1208; line-height: 1.3;
  margin-bottom: 4px;

}
.order-date { font-size: 12px; color: #8B7A5A; margin-bottom: 5px; }
.order-badges { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.badge {

  padding: 2px 8px; border-radius: 20px;
  font-size: 10px; font-weight: 700;
  white-space: nowrap;
}
.badge-type-num  { background: #EBF5F7; color: #3D7A8A; }
.badge-type-phys { background: #F5EDE0; color: #8B6230; }
.badge-attente   { background: #FEF5E7; color: #B07D00; }
.badge-prep      { background: #EBF5F7; color: #3D7A8A; }
.badge-expedie   { background: #EDFAF1; color: #1E7E3C; }
.badge-livre     { background: #F0F0F0; color: #555; }
.badge-annule    { background: #FDE8EE; color: #C96B8A; }

.order-action {
  flex-shrink: 0;
  width: 36px; height: 36px;
  border-radius: 10px;
  border: 1px solid #E2D4BC;
  background: none;
  display: flex; align-items: center; justify-content: center;
  color: #8B7A5A;
  transition: color 0.15s, border-color 0.15s;
}
.order-action:hover { color: #5B9EAD; border-color: #5B9EAD; }

.tracking-link {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 600; color: #5B9EAD;
  margin-top: 4px;
}
.tracking-link .ms { font-size: 13px; }

/* ── Adresses ── */
.address-card {
  background: white;
  border: 1px solid #E2D4BC;
  border-radius: 14px;
  padding: 14px 16px;

}

.btn-add {

  border: 1.5px dashed #C9B99A;
  border-radius: 14px;
  color: #8B7A5A;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px; font-weight: 600;

  margin-top: 6px;

/* ── Formulaire adresse ── */
.form-card {

  border: 1px solid #E2D4BC;
  border-radius: 14px;

.field-group { margin-bottom: 12px; }
.field-label { display: block; font-size: 11px; font-weight: 700; color: #8B7A5A; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
.field-input {

  transition: border-color 0.2s;
}
.field-input:focus { border-color: #5B9EAD; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-actions { display: flex; gap: 8px; margin-top: 14px; }

/* ── Boutons ── */
.btn-primary {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 20px; border-radius: 12px;
  background: #5B9EAD; color: white; border: none;
  font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
  transition: background 0.15s;
}
.btn-primary:hover { background: #3D7A8A; }

.btn-ghost {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 16px; border-radius: 12px;
  background: none; color: #8B7A5A;
  border: 1.5px solid #E2D4BC;
  font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
  transition: border-color 0.15s, color 0.15s;
}
.btn-ghost:hover { border-color: #5B9EAD; color: #5B9EAD; }
.btn-danger-soft {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 16px; border-radius: 12px;
  background: #FEF0F0; color: #C03030; border: none;
  font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;

}
.btn-danger-soft:hover { background: #FDDCDC; }

/* ── Mon compte ── */
.compte-section {
  background: white;
  border: 1px solid #E2D4BC;

  margin-bottom: 12px;

.compte-row-edit {
  margin-left: auto; flex-shrink: 0;

  border-radius: 8px; border: 1px solid #E2D4BC;

  display: flex; align-items: center; justify-content: center;

}
.compte-row-edit:hover { color: #5B9EAD; border-color: #5B9EAD; }

/* Edit nom inline */
.edit-inline { display: flex; gap: 8px; align-items: center; flex: 1; min-width: 0; }
.edit-inline input { flex: 1; }

/* Déconnexion row */
.signout-row {

  font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
  color: #8B7A5A; cursor: pointer;
  transition: color 0.15s;
}
.signout-row:hover { color: #1A1208; }

/* Suppression compte */
.danger-card {
  background: white;
  border: 1px solid #E2D4BC;
  border-radius: 14px;
  padding: 18px;
}
.danger-card h3 { font-size: 13px; font-weight: 700; color: #1A1208; margin-bottom: 6px; }
.danger-card p { font-size: 12px; color: #8B7A5A; line-height: 1.6; margin-bottom: 14px; }

/* ── Skeleton ── */
.skeleton {
  position: relative; overflow: hidden;
  background: #E8DCC8; border-radius: 8px;
}
.skeleton::after {
  content: ""; position: absolute; inset: 0;
  transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
  animation: shimmer 1.4s infinite;
}
@keyframes shimmer { to { transform: translateX(100%); } }
@media (prefers-reduced-motion: reduce) {
  .skeleton::after { animation: none; }
}

/* ── État vide ── */
.empty-state {

}
.empty-state .ms { font-size: 44px; color: #D8C8AA; display: block; margin-bottom: 12px; }
.empty-state p { font-size: 13px; line-height: 1.6; }
.empty-state a { color: #5B9EAD; font-weight: 600; }

/* ── Nav mobile ── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;

@media (min-width: 768px) { .bottom-nav { display: none; } }
.nav-item {

<script>
let session = null;
let editNomOpen = false;

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleDateString('fr-FR', { day:'2-digit', month:'long', year:'numeric' });
}

// ── Navigation onglets ──
function showTab(name) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  document.querySelector(`[data-tab="${name}"]`).classList.add('active');
}

// ── Init ──
async function init() {
  const { data: { session: s } } = await _supabase.auth.getSession();
  if (!s) { window.location.href = 'login.html'; return; }
  session = s;
  loadProfile();
  loadCommandes();
  loadAdresses();
}

// ── Profil ──
async function loadProfile() {
  const { data: profile } = await _supabase
    .from('profiles')
    .select('display_name, role')
    .eq('id', session.user.id)
    .single();

  const nom = profile?.display_name || session.user.email.split('@')[0];
  const email = session.user.email;

  // Bandeau
  document.getElementById('avatar-circle').textContent = nom[0].toUpperCase();
  document.getElementById('display-name').outerHTML =
    `<div id="display-name" class="profile-name">Bonjour, ${esc(nom)} !</div>`;
  document.getElementById('user-email').outerHTML =
    `<div id="user-email" class="profile-email">${esc(email)}</div>`;

  // Onglet Mon compte
  document.getElementById('compte-email').textContent = email;
  document.getElementById('compte-nom').textContent = nom;
  document.getElementById('input-nom').value = profile?.display_name || '';

  if (profile?.role === 'admin') {
    document.querySelector('.profile-inner').insertAdjacentHTML('beforeend',
      `<a href="admin.html" title="Admin" style="margin-left:auto;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.18);border:1.5px solid rgba(255,255,255,0.35);display:flex;align-items:center;justify-content:center;color:white;flex-shrink:0;">
         <span class="ms" style="font-size:18px;">admin_panel_settings</span>
       </a>`);
  }
}

function toggleEditNom() {
  editNomOpen = !editNomOpen;
  document.getElementById('nom-row').style.display     = editNomOpen ? 'none' : 'flex';
  document.getElementById('edit-nom-row').style.display = editNomOpen ? 'flex' : 'none';
  if (editNomOpen) document.getElementById('input-nom').focus();
}

async function saveNom() {
  const nom = document.getElementById('input-nom').value.trim();
  if (!nom) return;
  const { error } = await _supabase.from('profiles').upsert({ id: session.user.id, display_name: nom });
  if (error) { showToast('Erreur lors de la sauvegarde', 'error'); return; }
  document.getElementById('compte-nom').textContent = nom;
  document.getElementById('avatar-circle').textContent = nom[0].toUpperCase();
  const nameEl = document.getElementById('display-name');
  if (nameEl) nameEl.textContent = `Bonjour, ${nom} !`;
  toggleEditNom();
  showToast('Nom mis à jour ✓', 'success');
}

// ── Commandes (physiques + numériques unifiées) ──
const STATUTS = {
  confirmed:      { label: 'En attente',     cls: 'badge-attente' },
  en_attente:     { label: 'En attente',     cls: 'badge-attente' },
  en_preparation: { label: 'En préparation', cls: 'badge-prep'    },
  expedie:        { label: 'Expédié',        cls: 'badge-expedie' },
  livre:          { label: 'Livré',          cls: 'badge-livre'   },
  annule:         { label: 'Annulé',         cls: 'badge-annule'  },
};

async function loadCommandes() {
  const email = session.user.id;

  const [physRes, numRes] = await Promise.all([
    _supabase
      .from('commandes_physiques')
      .select('id, created_at, statut, montant_total, numero_suivi, ressource_id, personnalisation, resources(title, preview_url)')
      .eq('email_client', session.user.email)
      .order('created_at', { ascending: false }),
    _supabase
      .from('purchases')
      .select('id, created_at, resource_id, download_token, resources(title, preview_url, file_url)')
      .eq('user_id', session.user.id)
      .order('created_at', { ascending: false }),
  ]);

  document.getElementById('commandes-skeleton').style.display = 'none';
  const list = document.getElementById('commandes-list');
  list.style.display = 'block';

  const physiques  = (physRes.data  || []).map(o => ({ ...o, _type: 'physique'  }));
  const numeriques = (numRes.data   || []).map(o => ({ ...o, _type: 'numerique' }));
  const all = [...physiques, ...numeriques].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

  if (!all.length) {
    list.innerHTML = `
      <div class="empty-state">
        <span class="ms">receipt_long</span>
        <p>Vous n'avez pas encore de commande.<br>
           <a href="ressources.html">Découvrir la boutique →</a></p>
      </div>`;
    return;
  }

  list.innerHTML = all.map(o => o._type === 'physique' ? renderPhysique(o) : renderNumerique(o)).join('');
}

function renderPhysique(o) {
  const r      = o.resources || {};
  const titre  = esc(r.title || 'Produit physique');
  const thumb  = r.preview_url
    ? `<img src="${esc(r.preview_url)}" class="order-thumb" alt="" loading="lazy">`
    : `<div class="order-thumb-placeholder"><span class="ms" style="font-size:22px;color:#C9B99A;">inventory_2</span></div>`;
  const st     = STATUTS[o.statut] || STATUTS.en_attente;
  const prix   = o.montant_total ? `${(o.montant_total / 100).toFixed(2)} €` : '';
  const perso  = o.personnalisation && Object.keys(o.personnalisation).length
    ? `<div style="font-size:11px;color:#8B7A5A;margin-top:3px;">${Object.entries(o.personnalisation).filter(([,v])=>v).map(([k,v])=>`${k} : ${esc(String(v))}`).join(' · ')}</div>`
    : '';
  const suivi  = o.numero_suivi
    ? `<a href="https://www.laposte.fr/outils/suivre-vos-envois?code=${encodeURIComponent(o.numero_suivi)}" target="_blank" rel="noopener" class="tracking-link">
         <span class="ms">local_shipping</span> Suivre ma commande
       </a>`
    : '';

  return `
    <div class="order-card">
      ${thumb}
      <div class="order-meta">
        <div class="order-title">${titre}</div>
        <div class="order-date">${fmtDate(o.created_at)}${prix ? ' · ' + prix : ''}</div>
        <div class="order-badges">
          <span class="badge badge-type-phys">Physique</span>
          <span class="badge ${st.cls}">${st.label}</span>
        </div>
        ${perso}
        ${suivi}
      </div>
    </div>`;
}

function renderNumerique(o) {
  const r     = o.resources || {};
  const titre = esc(r.title || 'Ressource numérique');
  const thumb = r.preview_url
    ? `<img src="${esc(r.preview_url)}" class="order-thumb" alt="" loading="lazy">`
    : `<div class="order-thumb-placeholder"><span class="ms" style="font-size:22px;color:#C9B99A;">description</span></div>`;

  return `
    <div class="order-card">
      ${thumb}
      <div class="order-meta">
        <div class="order-title">${titre}</div>
        <div class="order-date">${fmtDate(o.created_at)}</div>
        <div class="order-badges">
          <span class="badge badge-type-num">Numérique</span>
          <span class="badge badge-expedie">Payé</span>
        </div>
      </div>
      <button onclick="downloadResource('${esc(r.file_url || '')}', '${titre}', this)"
              class="order-action" aria-label="Télécharger" title="Re-télécharger">
        <span class="ms" style="font-size:18px;">download</span>
      </button>
    </div>`;
}

async function downloadResource(fileUrl, title, btn) {
  if (!fileUrl) { showToast('Fichier introuvable', 'error'); return; }
  btn.disabled = true;
  btn.querySelector('.ms').textContent = 'hourglass_empty';
  const { data: signed, error } = await _supabase.storage.from('resources').createSignedUrl(fileUrl, 3600);
  btn.disabled = false;
  btn.querySelector('.ms').textContent = 'download';
  if (error || !signed?.signedUrl) { showToast('Impossible de générer le lien', 'error'); return; }
  const a = document.createElement('a');
  a.href = signed.signedUrl;
  a.download = (title || 'ressource') + '.pdf';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

// ── Adresses ──
async function loadAdresses() {
  const { data, error } = await _supabase
    .from('adresses_livraison')
    .select('*')
    .eq('user_id', session.user.id)
    .order('created_at', { ascending: false });

  const list  = document.getElementById('adresses-list');
  const items = (!error && data) ? data : [];

  if (!items.length) {
    list.innerHTML = `
      <div class="empty-state" style="padding:32px 20px;">
        <span class="ms">home</span>
        <p>Aucune adresse enregistrée.<br>Ajoutez-en une pour accélérer vos prochaines commandes.</p>
      </div>`;
    return;
  }

  list.innerHTML = items.map(a => `
    <div class="address-card">
      <span class="ms" style="font-size:20px;color:#5B9EAD;flex-shrink:0;margin-top:1px;">location_on</span>
      <div class="address-info">
        <div class="address-name">${esc(a.nom)}</div>
        <div class="address-detail">
          ${esc(a.rue)}${a.complement ? ', ' + esc(a.complement) : ''}<br>
          ${esc(a.code_postal)} ${esc(a.ville)}${a.pays !== 'FR' ? ' — ' + esc(a.pays) : ''}
        </div>
      </div>
      <button class="address-del" onclick="deleteAdresse('${a.id}')" aria-label="Supprimer">
        <span class="ms" style="font-size:16px;">delete</span>
      </button>
    </div>`).join('');
}

function showAddAdresse() {
  document.getElementById('adresse-form').style.display = 'block';
  document.getElementById('adr-nom').focus();
}
function hideAddAdresse() {
  document.getElementById('adresse-form').style.display = 'none';
  ['adr-nom','adr-rue','adr-complement','adr-cp','adr-ville'].forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('adr-pays').value = 'FR';
}
async function saveAdresse() {
  const nom   = document.getElementById('adr-nom').value.trim();
  const rue   = document.getElementById('adr-rue').value.trim();
  const comp  = document.getElementById('adr-complement').value.trim();
  const cp    = document.getElementById('adr-cp').value.trim();
  const ville = document.getElementById('adr-ville').value.trim();
  const pays  = document.getElementById('adr-pays').value;
  if (!nom || !rue || !cp || !ville) { showToast('Remplis les champs obligatoires *', 'error'); return; }
  const { error } = await _supabase.from('adresses_livraison')
    .insert({ user_id: session.user.id, nom, rue, complement: comp || null, code_postal: cp, ville, pays });
  if (error) { showToast('Erreur lors de l\'enregistrement', 'error'); return; }
  hideAddAdresse();
  showToast('Adresse enregistrée ✓', 'success');
  loadAdresses();
}
async function deleteAdresse(id) {
  if (!confirm('Supprimer cette adresse ?')) return;
  const { error } = await _supabase.from('adresses_livraison').delete().eq('id', id);
  if (!error) { showToast('Adresse supprimée', 'info'); loadAdresses(); }
}

// ── Suppression compte ──
async function deleteAccount() {
  if (!confirm('Supprimer définitivement votre compte ?\nToutes vos données personnelles seront effacées. Cette action est irréversible.')) return;
  if (!confirm('Dernière confirmation : votre compte sera supprimé.')) return;
  const { error } = await _supabase.functions.invoke('delete-account');
  if (error) { showToast('Erreur : ' + error.message, 'error'); return; }
  showToast('Compte supprimé. Au revoir.', 'info');
  setTimeout(() => { window.location.href = 'index.html'; }, 2000);
}

// ── Auth ──
async function logout() {
  await _supabase.auth.signOut();
  window.location.href = 'index.html';
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
init();
</script>
