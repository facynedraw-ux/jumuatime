<script>
// ── State ──
let allPhysiques  = [];
let allNumeriques = [];
let currentTab    = 'physiques';
let currentStatus = '';
let currentCmd    = null;
let selectedIds   = new Set();

// ── Boot ──
(async () => {
  const ok = await isAdmin();
  if (!ok) { window.location.href = 'login.html'; return; }
  await loadAll();
})();

// ── Data ──
async function loadAll() {
  const [physRes, numRes] = await Promise.all([
    _supabase
      .from('commandes_physiques')
      .select('*, resources(title, preview_url, price)')
      .order('created_at', { ascending: false }),
    _supabase
      .from('purchases')
      .select('id, created_at, user_id, resources(title, preview_url, price)')
      .order('created_at', { ascending: false }),
  ]);

  if (physRes.error) console.error('commandes_physiques:', physRes.error.message);
  if (numRes.error)  console.error('purchases:', numRes.error.message);

  allPhysiques  = physRes.data || [];
  allNumeriques = numRes.data  || [];

  const total = allPhysiques.length + allNumeriques.length;
  document.getElementById('count-label').textContent = `${total} commande${total !== 1 ? 's' : ''} au total`;
  document.getElementById('chip-physiques').textContent  = allPhysiques.length;
  document.getElementById('chip-numeriques').textContent = allNumeriques.length;

  renderList();
}

// ── Tabs / Filters ──
function switchTab(tab) {
  currentTab = tab;
  selectedIds.clear();
  updateSelectionBar();
  document.getElementById('tab-physiques').classList.toggle('active', tab === 'physiques');
  document.getElementById('tab-numeriques').classList.toggle('active', tab === 'numeriques');
  document.getElementById('status-bar').style.display = tab === 'physiques' ? 'flex' : 'none';
  renderList();
}

function setStatus(s) {
  currentStatus = s;
  document.querySelectorAll('#status-bar .filter-pill').forEach(p => {
    p.classList.toggle('active', p.dataset.s === s);
  });
  renderList();
}

// ── Render ──
function renderList() {
  const el = document.getElementById('orders-list');
  el.innerHTML = '';

  if (currentTab === 'physiques') {
    const list = currentStatus
      ? allPhysiques.filter(o => o.statut === currentStatus)
      : allPhysiques;
    if (!list.length) { el.innerHTML = emptyState('Aucune commande physique'); return; }
    el.innerHTML = list.map(rowPhysique).join('');
  } else {
    if (!allNumeriques.length) { el.innerHTML = emptyState('Aucun achat numérique'); return; }
    el.innerHTML = allNumeriques.map(rowNumerique).join('');
  }
}

function emptyState(msg) {
  return `<div class="text-center py-16 text-muted">
    <span class="ms" style="font-size:40px;display:block;margin-bottom:12px;color:#E8D5DC;">inbox</span>
    <span style="font-size:14px;">${msg}</span>
  </div>`;
}

function rowPhysique(o) {
  const adr    = o.adresse_livraison || {};
  const name   = adr.name || adr.full_name || adr.nom || '—';
  const email  = adr.email || '—';
  const prod   = o.resources || {};
  const date   = fmtDate(o.created_at);
  const prix   = o.montant_total ? `${(o.montant_total/100).toFixed(2)} €` :
                 (prod.price ? `${(prod.price/100).toFixed(2)} €` : '—');
  const thumb  = prod.preview_url
    ? `<img src="${prod.preview_url}" alt="" class="w-11 h-11 rounded-xl object-cover flex-shrink-0">`
    : `<div class="w-11 h-11 rounded-xl flex-shrink-0" style="background:#F5E8F0;"></div>`;
  const checked = selectedIds.has(o.id) ? 'checked' : '';

  return `
  <div class="order-row" onclick="openPanel('${o.id}')">
    <div onclick="event.stopPropagation()" style="flex-shrink:0;padding:2px;">
      <input type="checkbox" id="cb-${o.id}" ${checked} onchange="toggleSelect('${o.id}')"
        style="width:16px;height:16px;accent-color:#C96B8A;cursor:pointer;">
    </div>
    ${thumb}
    <div class="flex-1 min-w-0">
      <div class="font-semibold text-sm truncate">${prod.title || '—'}</div>
      <div class="text-xs text-muted truncate">${name} · <span style="color:#9B7FA6;">${email}</span></div>
    </div>
    <div class="text-right flex-shrink-0 space-y-1">
      <div class="text-xs text-muted">${date}</div>
      ${statusBadge(o.statut)}
    </div>
    <div class="font-bold text-sm flex-shrink-0 w-16 text-right" style="color:#C96B8A;">${prix}</div>
    <span class="ms flex-shrink-0" style="font-size:18px;color:#C96B8A;">chevron_right</span>
  </div>`;
}

function rowNumerique(o) {
  const prod  = o.resources || {};
  const date  = fmtDate(o.created_at);
  const prix  = prod.price ? `${(prod.price/100).toFixed(2)} €` : '—';
  const thumb = prod.preview_url
    ? `<img src="${prod.preview_url}" alt="" class="w-11 h-11 rounded-xl object-cover flex-shrink-0">`
    : `<div class="w-11 h-11 rounded-xl flex-shrink-0" style="background:#F5E8F0;"></div>`;
  const checked = selectedIds.has(o.id) ? 'checked' : '';

  return `
  <div class="order-row no-click">
    <div style="flex-shrink:0;padding:2px;">
      <input type="checkbox" id="cb-${o.id}" ${checked} onchange="toggleSelect('${o.id}')"
        style="width:16px;height:16px;accent-color:#C96B8A;cursor:pointer;">
    </div>
    ${thumb}
    <div class="flex-1 min-w-0">
      <div class="font-semibold text-sm truncate">${prod.title || '—'}</div>
      <div class="text-xs text-muted font-mono truncate">${o.user_id ? o.user_id.slice(0,12)+'…' : '—'}</div>
    </div>
    <div class="text-right flex-shrink-0 space-y-1">
      <div class="text-xs text-muted">${date}</div>
      <span style="display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700;background:#D4EBD4;color:#207040;">✓ Payé</span>
    </div>
    <div class="font-bold text-sm flex-shrink-0 w-16 text-right" style="color:#C96B8A;">${prix}</div>
    <span class="ms flex-shrink-0" style="font-size:18px;color:#E8D5DC;">chevron_right</span>
  </div>`;
}

function statusBadge(statut) {
  const map = {
    en_attente:     { label:'En attente',     bg:'#FFF3CD', color:'#856404' },
    en_preparation: { label:'En préparation', bg:'#D1ECF1', color:'#0C5460' },
    expedie:        { label:'Expédié',        bg:'#D4EBD4', color:'#207040' },
    livre:          { label:'Livré',          bg:'#E8F0E8', color:'#5B8A5F' },
    annule:         { label:'Annulé',         bg:'#F8D7DA', color:'#721C24' },
  };
  const s = map[statut] || { label: statut || '—', bg:'#E8D5DC', color:'#7A5A6A' };
  return `<span style="display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700;background:${s.bg};color:${s.color};">${s.label}</span>`;
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric' });
}

// ── Panel ──
function openPanel(id) {
  const o = allPhysiques.find(x => x.id === id);
  if (!o) return;
  currentCmd = o;
  renderPanel(o);
  document.getElementById('panel-overlay').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}

function maybeClosePanel(e) {
  if (e.target === document.getElementById('panel-overlay')) closePanel();
}

function closePanel() {
  document.getElementById('panel-overlay').classList.add('hidden');
  document.body.style.overflow = '';
}

function renderPanel(o) {
  const adr    = o.adresse_livraison || {};
  const name   = adr.name || adr.full_name || adr.nom || '—';
  const email  = adr.email || '—';
  const prod   = o.resources || {};
  const perso  = o.personnalisation || {};
  const ref    = (o.stripe_session_id || o.id).slice(-12).toUpperCase();
  const date   = o.created_at ? new Date(o.created_at).toLocaleString('fr-FR') : '—';

  const livraison  = o.montant_livraison || 0;
  const total      = o.montant_total;
  const sousTotal  = (total && livraison) ? total - livraison : (prod.price || 0);

  // Adresse
  const adrParts = [adr.line1, adr.line2, [adr.postal_code, adr.city].filter(Boolean).join(' '), adr.country].filter(Boolean);

  // Personnalisation
  const persoEntries = Object.entries(perso).filter(([,v]) => v);

  document.getElementById('panel-content').innerHTML = `
    <div class="flex items-start justify-between mb-1">
      <h2 class="font-display font-bold text-lg" style="color:#3D1F2D;">Commande</h2>
      <button onclick="closePanel()" style="background:none;border:none;cursor:pointer;padding:4px;color:#7A5A6A;">
        <span class="ms" style="font-size:22px;">close</span>
      </button>
    </div>
    <div class="text-xs text-muted mb-1">Réf. <span class="font-mono font-semibold">${ref}</span></div>
    <div class="text-xs text-muted mb-5">${date}</div>

    <!-- Statut -->
    <div class="flex items-center gap-3 p-3 rounded-xl mb-5" style="background:#FFF5F7;">
      <div>
        <div class="text-xs text-muted mb-1">Statut actuel</div>
        ${statusBadge(o.statut)}
      </div>
    </div>

    <!-- Produit -->
    <div class="f-sep" style="margin-top:0;"></div>
    <div class="f-label">Produit commandé</div>
    <div class="flex gap-3 items-center mb-3">
      ${prod.preview_url ? `<img src="${prod.preview_url}" alt="" class="w-14 h-14 rounded-xl object-cover flex-shrink-0">` : ''}
      <div>
        <div class="font-semibold text-sm">${prod.title || '—'}</div>
        ${o.variante_id ? `<div class="text-xs text-muted mt-0.5">Variante : ${o.variante_id}</div>` : ''}
      </div>
    </div>

    ${persoEntries.length ? `
    <div class="p-3 rounded-xl mb-3" style="background:#FAF6F0;border:1px solid #E8D5DC;">
      <div class="text-xs font-bold text-muted uppercase tracking-wider mb-2">Personnalisation</div>
      ${persoEntries.map(([k,v]) => `<div class="text-xs mb-1"><span class="font-semibold">${k}</span> : ${v}</div>`).join('')}
    </div>` : ''}

    <!-- Client -->
    <div class="f-sep"></div>
    <div class="f-label">Client</div>
    <div class="text-sm font-semibold mb-0.5">${name}</div>
    <div class="text-xs text-muted mb-4" style="color:#9B7FA6;">${email}</div>

    ${adrParts.length ? `
    <div class="f-label">Adresse de livraison</div>
    <div class="text-sm leading-relaxed mb-4" style="background:#FAFAF8;border:1px solid #E8D5DC;border-radius:10px;padding:10px 12px;">
      ${adrParts.join('<br>')}
    </div>` : ''}

    <!-- Montants -->
    <div class="f-sep"></div>
    <div class="f-label">Récapitulatif</div>
    <div class="space-y-1 text-sm mb-5">
      ${sousTotal ? `<div class="flex justify-between"><span class="text-muted">Produit</span><span>${(sousTotal/100).toFixed(2)} €</span></div>` : ''}
      <div class="flex justify-between"><span class="text-muted">Livraison</span><span>${livraison ? (livraison/100).toFixed(2)+' €' : 'Offerte'}</span></div>
      ${total ? `<div class="flex justify-between font-bold pt-1 border-t border-border mt-1"><span>Total</span><span style="color:#C96B8A;">${(total/100).toFixed(2)} €</span></div>` : ''}
    </div>

    <!-- Changer statut -->
    <div class="f-sep"></div>
    <label class="f-label" for="pnl-statut">Changer le statut</label>
    <select id="pnl-statut" class="f-select mb-4">
      <option value="en_attente"     ${o.statut==='en_attente'    ?'selected':''}>⏳ En attente</option>
      <option value="en_preparation" ${o.statut==='en_preparation'?'selected':''}>📦 En préparation</option>
      <option value="expedie"        ${o.statut==='expedie'       ?'selected':''}>🚚 Expédié</option>
      <option value="livre"          ${o.statut==='livre'         ?'selected':''}>✅ Livré</option>
      <option value="annule"         ${o.statut==='annule'        ?'selected':''}>❌ Annulé</option>
    </select>

    <label class="f-label" for="pnl-suivi">Numéro de suivi</label>
    <input id="pnl-suivi" type="text" class="f-input mb-4" placeholder="Ex : 1Z999AA10123456784" value="${escHtml(o.numero_suivi || '')}">

    <label class="f-label" for="pnl-notes">Notes internes</label>
    <textarea id="pnl-notes" class="f-textarea mb-2" rows="3" placeholder="Mémo visible uniquement par vous…">${escHtml(o.notes_admin || '')}</textarea>
    <div id="pnl-msg" class="text-xs text-center mb-3 hidden"></div>
  `;

  document.getElementById('panel-actions').innerHTML = `
    <div class="flex gap-2">
      <button onclick="saveOrder()" class="btn-primary flex-1 justify-center">
        <span class="ms" style="font-size:17px;">save</span> Enregistrer
      </button>
      <button onclick="deleteOrder('${o.id}')" style="background:#FEE2E2;color:#B91C1C;border:none;border-radius:12px;padding:10px 14px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;" title="Supprimer cette commande">
        <span class="ms" style="font-size:17px;">delete</span>
      </button>
    </div>
  `;
}

async function saveOrder() {
  if (!currentCmd) return;
  const btn         = document.querySelector('#panel-actions .btn-primary');
  const statut      = document.getElementById('pnl-statut').value;
  const suivi       = document.getElementById('pnl-suivi').value.trim();
  const notes       = document.getElementById('pnl-notes').value.trim();
  const msg         = document.getElementById('pnl-msg');
  const wasExpedie  = currentCmd.statut === 'expedie';
  const nowExpedie  = statut === 'expedie';

  btn.disabled = true;
  btn.innerHTML = '<span class="ms" style="font-size:17px;">hourglass_top</span> Enregistrement…';

  const { error } = await _supabase
    .from('commandes_physiques')
    .update({ statut, numero_suivi: suivi || null, notes_admin: notes || null })
    .eq('id', currentCmd.id);

  btn.disabled = false;
  btn.innerHTML = '<span class="ms" style="font-size:17px;">save</span> Enregistrer';

  if (error) {
    msg.textContent = 'Erreur : ' + error.message;
    msg.style.color = '#C96B8A';
    msg.classList.remove('hidden');
    setTimeout(() => msg.classList.add('hidden'), 4000);
    return;
  }

  currentCmd.statut       = statut;
  currentCmd.numero_suivi = suivi || null;
  currentCmd.notes_admin  = notes || null;
  renderList();

  // Email expédition — uniquement si on passe à "expedie" (pas si c'était déjà expedie)
  if (nowExpedie && !wasExpedie) {
    const adr   = currentCmd.adresse_livraison || {};
    const email = adr.email || '';
    const name  = adr.name || adr.full_name || '';
    const prod  = currentCmd.resources || {};

    if (email) {
      fetch('/api/email-expedition', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, name, produit: prod.title || '', tracking: suivi }),
      }).catch(() => {});
    }
  }

  closePanel();
}

// ── Sélection / Suppression ──
function toggleSelect(id) {
  if (selectedIds.has(id)) selectedIds.delete(id);
  else selectedIds.add(id);
  updateSelectionBar();
}

function updateSelectionBar() {
  const bar = document.getElementById('selection-bar');
  const n = selectedIds.size;
  if (n > 0) {
    bar.classList.remove('hidden');
    document.getElementById('selection-count').textContent = `${n} sélectionnée${n > 1 ? 's' : ''}`;
  } else {
    bar.classList.add('hidden');
  }
}

function clearSelection() {
  selectedIds.clear();
  updateSelectionBar();
  renderList();
}

async function deleteSelected() {
  const n = selectedIds.size;
  if (!n) return;
  if (!confirm(`Supprimer ${n} commande${n > 1 ? 's' : ''} ? Cette action est irréversible.`)) return;
  const table = currentTab === 'physiques' ? 'commandes_physiques' : 'purchases';
  const { error } = await _supabase.from(table).delete().in('id', [...selectedIds]);
  if (error) { alert('Erreur : ' + error.message); return; }
  selectedIds.clear();
  await loadAll();
}

async function deleteOrder(id) {
  if (!confirm('Supprimer cette commande ? Cette action est irréversible.')) return;
  const { error } = await _supabase.from('commandes_physiques').delete().eq('id', id);
  if (error) { alert('Erreur : ' + error.message); return; }
  closePanel();
  await loadAll();
}

// ── Nouvelle commande manuelle ──
let newOrderProducts = [];

async function openNewOrder() {
  const ov = document.getElementById('new-order-overlay');
  ov.classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  // Charger produits physiques/bundles actifs
  if (newOrderProducts.length === 0) {
    const { data } = await _supabase
      .from('resources')
      .select('id, title, price, type_produit')
      .in('type_produit', ['physique', 'bundle'])
      .eq('is_active', true)
      .order('title');
    newOrderProducts = data || [];
    const sel = document.getElementById('no-produit');
    sel.innerHTML = '<option value="">— Choisir un produit —</option>' +
      newOrderProducts.map(p => `<option value="${p.id}" data-price="${Math.round(p.price * 100)}">${escHtml(p.title)}</option>`).join('');
  }
  document.getElementById('no-form').reset();
  document.getElementById('no-result').textContent = '';
}

function closeNewOrder() {
  document.getElementById('new-order-overlay').classList.add('hidden');
  document.body.style.overflow = '';
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('no-produit').addEventListener('change', function() {
    const opt = this.options[this.selectedIndex];
    const price = parseInt(opt.dataset.price || '0');
    const ship  = 490;
    document.getElementById('no-montant-produit').value = (price / 100).toFixed(2);
    document.getElementById('no-montant-livraison').value = (ship / 100).toFixed(2);
    document.getElementById('no-montant-total').value = ((price + ship) / 100).toFixed(2);
  });
  document.getElementById('no-montant-produit').addEventListener('input', recalcTotal);
  document.getElementById('no-montant-livraison').addEventListener('input', recalcTotal);
});

function recalcTotal() {
  const p = parseFloat(document.getElementById('no-montant-produit').value) || 0;
  const l = parseFloat(document.getElementById('no-montant-livraison').value) || 0;
  document.getElementById('no-montant-total').value = (p + l).toFixed(2);
}

async function submitNewOrder() {
  const btn = document.getElementById('no-submit-btn');
  const res = document.getElementById('no-result');
  const produitId  = document.getElementById('no-produit').value;
  const nom        = document.getElementById('no-nom').value.trim();
  const email      = document.getElementById('no-email').value.trim();
  const line1      = document.getElementById('no-line1').value.trim();
  const line2      = document.getElementById('no-line2').value.trim();
  const postal     = document.getElementById('no-postal').value.trim();
  const city       = document.getElementById('no-city').value.trim();
  const montantP   = Math.round((parseFloat(document.getElementById('no-montant-produit').value) || 0) * 100);
  const montantL   = Math.round((parseFloat(document.getElementById('no-montant-livraison').value) || 0) * 100);
  const montantT   = Math.round((parseFloat(document.getElementById('no-montant-total').value) || 0) * 100);
  const statut     = document.getElementById('no-statut').value;
  const notes      = document.getElementById('no-notes').value.trim();

  if (!produitId) { res.textContent = 'Choisissez un produit.'; res.style.color = '#C0392B'; return; }
  if (!nom)       { res.textContent = 'Nom du client requis.'; res.style.color = '#C0392B'; return; }
  if (!email)     { res.textContent = 'Email du client requis.'; res.style.color = '#C0392B'; return; }
  if (!line1 || !postal || !city) { res.textContent = 'Adresse incomplète (rue, code postal, ville).'; res.style.color = '#C0392B'; return; }

  btn.disabled = true;
  btn.textContent = 'Enregistrement…';
  res.textContent = '';

  const { error } = await _supabase.from('commandes_physiques').insert({
    stripe_session_id: 'MANUEL-' + Date.now(),
    ressource_id:      produitId,
    variante_id:       null,
    personnalisation:  {},
    montant_produit:   montantP,
    montant_total:     montantT,
    montant_livraison: montantL,
    email_client:      email,
    nom_client:        nom,
    adresse_livraison: { name: nom, email, line1, line2: line2 || null, postal_code: postal, city, country: 'FR' },
    statut,
    notes_admin:       notes || null,
  });

  if (error) {
    res.textContent = 'Erreur : ' + error.message;
    res.style.color = '#C0392B';
    btn.disabled = false;
    btn.textContent = 'Créer la commande';
    return;
  }

  res.textContent = 'Commande créée !';
  res.style.color = '#065F46';
  btn.textContent = 'Créer la commande';
  btn.disabled = false;
  await loadAll();
  setTimeout(closeNewOrder, 1200);
}

// ── Auth ──
async function signOut() {
  await _supabase.auth.signOut();
  window.location.href = 'login.html';
}

// ── Utils ──
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
